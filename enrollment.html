<!DOCTYPE html>
<html lang="en">
<head>
<%- include('src/partials/head', { title: 'Enrollment', description: 'Reserve a place in a Codeline course.' }) %>
</head>
<body>
<%- include('src/partials/header', { active: 'enrollment' }) %>
<main class="main" id="main">
  <section class="hero" aria-labelledby="page-title">
    <h1 class="hero__title" id="page-title">Enrollment</h1>
    <p class="hero__text">Fill in the form to reserve a place.</p>
  </section>

  <form class="form" action="./enrollment.html" method="post" aria-labelledby="page-title">
    <div class="form__field">
      <label class="form__label" for="full-name">Full name</label>
      <input class="input" id="full-name" name="fullName" type="text" placeholder="Anna Weber" autocomplete="name" required>
    </div>
    <div class="form__field">
      <label class="form__label" for="email">Email</label>
      <input class="input" id="email" name="email" type="email" placeholder="name@example.com" autocomplete="email" required>
    </div>
    <div class="form__field">
      <label class="form__label" for="course">Course</label>
      <select class="input" id="course" name="course" required>
        <% courses.forEach(function (course) { %>
        <option value="<%= course.title %>"<%- course.title === featured.title ? ' selected' : '' %>><%= course.title %></option>
        <% }); %>
      </select>
    </div>
    <button class="button button--primary" type="submit">Confirm enrollment</button>
  </form>
</main>
<%- include('src/partials/footer') %>
</body>
</html>
