<!DOCTYPE html>
<html lang="en">
<head>
<%- include('src/partials/head', { title: 'Enrollment', description: 'Reserve a place in a Codeline course.' }) %>
</head>
<body>
<%- include('src/partials/header', { active: 'enrollment' }) %>
<main class="main" id="main">
  <section class="hero" aria-labelledby="page-title">
    <h1 class="hero__title" id="page-title" data-i18n="enroll.title"><%= t('enroll.title') %></h1>
    <p class="hero__text" data-i18n="enroll.text"><%= t('enroll.text') %></p>
  </section>

  <form class="form" action="./enrollment.html" method="post" aria-labelledby="page-title">
    <div class="form__field">
      <label class="form__label" for="full-name" data-i18n="enroll.name"><%= t('enroll.name') %></label>
      <input class="input" id="full-name" name="fullName" type="text" placeholder="<%= t('enroll.namePlaceholder') %>" data-i18n-placeholder="enroll.namePlaceholder" autocomplete="name" required>
    </div>
    <div class="form__field">
      <label class="form__label" for="email" data-i18n="enroll.email"><%= t('enroll.email') %></label>
      <input class="input" id="email" name="email" type="email" placeholder="<%= t('enroll.emailPlaceholder') %>" data-i18n-placeholder="enroll.emailPlaceholder" autocomplete="email" required>
    </div>
    <div class="form__field">
      <label class="form__label" for="course" data-i18n="enroll.course"><%= t('enroll.course') %></label>
      <select class="input" id="course" name="course" required>
        <% courses.forEach(function (course) { %>
        <option value="<%= course.title %>"<%- course.title === featured.title ? ' selected' : '' %>><%= course.title %></option>
        <% }); %>
      </select>
    </div>
    <button class="button button--primary" type="submit" data-i18n="btn.confirm"><%= t('btn.confirm') %></button>
  </form>
</main>
<%- include('src/partials/footer') %>
</body>
</html>
